<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Xylophone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Web Audio API Demo</p>
      <h1 id="page-title">Keyboard Xylophone</h1>
      <p class="instructions">
        Press the labeled keys on your keyboard to play bright xylophone notes instantly.
        The matching bar will light up each time you strike it.
      </p>
    </section>

    <section class="pad-grid" aria-label="Xylophone keys">
      <button class="pad" data-key="A" type="button" aria-label="A key C note">
        <span class="pad-key">A</span>
        <span class="pad-name">C4</span>
      </button>
      <button class="pad" data-key="S" type="button" aria-label="S key D note">
        <span class="pad-key">S</span>
        <span class="pad-name">D4</span>
      </button>
      <button class="pad" data-key="D" type="button" aria-label="D key E note">
        <span class="pad-key">D</span>
        <span class="pad-name">E4</span>
      </button>
      <button class="pad" data-key="F" type="button" aria-label="F key G note">
        <span class="pad-key">F</span>
        <span class="pad-name">G4</span>
      </button>
      <button class="pad" data-key="G" type="button" aria-label="G key A note">
        <span class="pad-key">G</span>
        <span class="pad-name">A4</span>
      </button>
      <button class="pad" data-key="H" type="button" aria-label="H key C high note">
        <span class="pad-key">H</span>
        <span class="pad-name">C5</span>
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
